<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ViboLearning">
<meta name="description" content="SoloLearn-style course renderer — reads a JSON course and turns it into interactive lessons, quizzes and checkpoints.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>ViboLearning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ---- Nocturne (de-branded): a quiet, compact dark study surface.
     One accent, per course, used as a line and a glow — never a flood. ---- */
  :root{
    --bg:#161826; --surface:#232532; --raised:#2b2d3b;
    --text:#e9e9ed; --muted:#9397ab;
    --line:rgba(233,233,237,.14);
    --hairline:#3f424d; --locked:#3f424d; --locked-border:#595d6c;
    --code-bg:#292b31;
    --accent:#9184d9; --on-accent:#161826;
    --danger:#e5484d;
    --r-sm:6px; --r-md:9px; --r-lg:14px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:15px;line-height:1.5;
    overscroll-behavior:none;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  ::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{
    max-width:460px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;position:relative;
    background:var(--bg);
  }
  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---- header ---- */
  .head{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 6px;
    display:flex;align-items:flex-start;gap:12px;
  }
  .head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1;text-wrap:balance}
  .head .sub{padding:0 20px 4px;color:var(--muted);font-size:12.5px}
  .iconbtn{
    width:34px;height:34px;flex:none;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);
  }
  .iconbtn:active{background:var(--raised)}
  .iconbtn svg{width:17px;height:17px}

  /* ---- path ---- */
  .path{padding:12px 20px 28px;display:flex;flex-direction:column;align-items:center}
  .mod-head{width:100%;text-align:center;padding:26px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .mod-head .k{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .mod-head .t{font-size:15px;font-weight:600}
  .mod-head .rule{width:36px;height:1px;background:var(--line);margin-top:9px}
  .node{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0}
  .disc{
    width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
    border:3px solid var(--accent);position:relative;transition:transform .12s ease;
  }
  .disc:active{transform:scale(.94)}
  .disc.locked{border-color:var(--locked-border)}
  .disc .fill{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
  .disc.done .fill{background:var(--accent)}
  .disc.current .fill{background:var(--surface)}
  .disc.locked .fill{background:var(--locked)}
  .disc svg{width:24px;height:24px}
  .disc.done svg{color:var(--on-accent)}
  .disc.current svg{color:var(--accent)}
  .disc.locked svg{color:var(--muted)}
  .node .label{font-size:12px;color:color-mix(in srgb,var(--text) 82%,transparent);max-width:110px;text-align:center;line-height:1.25}
  .node[disabled]{opacity:1}
  .node.is-disabled{pointer-events:none}

  /* ---- practice tab ---- */
  .pane{padding:20px;display:flex;flex-direction:column;gap:16px}
  .pane h2{margin:0;font-size:22px;font-weight:600}
  .card-box{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px}
  .card-box .k{font-size:10.5px;letter-spacing:.1em;color:var(--muted);font-weight:600}
  .card-box .h{font-size:16px;font-weight:600}
  .card-box p{margin:0;color:color-mix(in srgb,var(--text) 85%,transparent);font-size:13.5px}
  .card-box .meta{color:var(--muted);font-size:12px;margin-top:2px}

  /* ---- tabbar ---- */
  .tabbar{
    display:flex;border-top:1px solid var(--line);background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--muted)}
  .tabbar button.on{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .tabbar span{font-size:11px}

  /* ---- buttons ---- */
  .btn{
    display:block;width:100%;text-align:center;padding:14px;border-radius:var(--r-md);
    border:1.5px solid var(--accent);color:var(--accent);font-weight:600;font-size:15px;
    background:transparent;
  }
  .btn.fill{background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .btn:active{background:color-mix(in srgb,var(--accent) 28%,transparent)}
  .btn:disabled{opacity:.4;border-color:var(--locked-border);color:var(--muted);background:transparent}
  .btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
  .btn.sm{width:auto;padding:12px 16px;font-size:14px}

  /* ---- session ---- */
  .play{display:flex;flex-direction:column;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .play-top{display:flex;align-items:center;gap:12px}
  .x{color:var(--muted);width:22px;height:22px;flex:none}
  .segs{flex:1;display:flex;gap:2px;height:8px}
  .segs i{flex:1;border-radius:4px;background:var(--hairline)}
  .segs i.done{background:var(--accent)}
  .segs i.cur{background:color-mix(in srgb,var(--accent) 55%,transparent)}
  .count{display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px;flex:none}
  .count svg{width:16px;height:16px}
  .count.heart{color:var(--danger)}
  .count.streak{color:var(--accent)}
  .timer{height:4px;border-radius:2px;background:var(--hairline);margin-top:12px;overflow:hidden}
  .timer i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
  .timer i.low{background:var(--danger)}

  .cardwrap{flex:1;overflow-y:auto;padding-top:18px}
  .instr{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;font-weight:500;font-size:13.5px;margin-bottom:20px}
  .prose{font-size:16px;line-height:1.6}
  .prose code,.q code{font-family:var(--mono);color:color-mix(in srgb,var(--accent) 88%,var(--text));font-size:.92em}
  .prose b{font-weight:600}
  pre.code,textarea.code{
    font-family:var(--mono);font-size:13.5px;line-height:1.5;background:var(--code-bg);
    border-radius:var(--r-sm);padding:14px;overflow-x:auto;white-space:pre;color:var(--text);
    border:1px solid var(--line);width:100%;
  }
  textarea.code{min-height:150px;resize:vertical}
  .caption{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .runrow{display:flex;gap:10px;margin-top:12px}
  .out{margin-top:12px;background:var(--code-bg);border-radius:var(--r-sm);padding:14px}
  .out .k{font-size:9.5px;letter-spacing:.09em;color:var(--muted)}
  .out pre{margin:6px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
  .q{font-size:16px;margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;padding:14px;border-radius:var(--r-sm);border:2px solid var(--line);
    background:var(--surface);color:var(--text);font-size:15px;
  }
  .opt.mono{font-family:var(--mono);font-size:14px}
  .opt.sel{border-color:var(--accent)}
  .opt.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent)}
  .opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 20%,var(--surface));color:var(--danger)}
  .typed{
    width:100%;padding:14px;border-radius:var(--r-sm);border:2px solid var(--line);
    background:var(--surface);font-family:var(--mono);font-size:16px;
  }
  .typed.ok{border-color:var(--accent)} .typed.no{border-color:var(--danger)}
  .cols{display:flex;gap:12px}
  .cols>div{flex:1;display:flex;flex-direction:column;gap:10px}
  .match{
    padding:13px 8px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--surface);
    text-align:center;font-size:13px;
  }
  .match.mono{font-family:var(--mono)}
  .match.sel{border-color:var(--accent)}
  .match.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);opacity:.55}
  .match.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
  .sub-h{color:var(--muted);font-size:12px;margin:14px 0 6px}

  .feedback{margin-top:16px;border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:9px}
  .feedback.ok{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
  .feedback.no{background:color-mix(in srgb,var(--danger) 16%,var(--surface))}
  .feedback .t{font-weight:600}
  .feedback.ok .t{color:var(--accent)} .feedback.no .t{color:var(--danger)}
  .feedback .why{font-size:13px}
  .actionbar{margin-top:12px}

  /* ---- result ---- */
  .result{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 24px calc(env(safe-area-inset-bottom) + 24px);text-align:center;overflow-y:auto}
  .result .star{width:56px;height:56px;color:var(--accent);animation:pop .45s ease}
  .result h2{margin:0;font-size:22px;font-weight:600}
  .stats{display:flex;gap:26px}
  .stats .v{font-size:22px;font-weight:600}
  .stats .l{font-size:12px;color:var(--muted)}
  .learned{width:100%;background:var(--surface);border-radius:var(--r-lg);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
  .learned .k{font-size:10.5px;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}
  .learned .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .learned .row:last-child{border-bottom:none}
  .learned .row .m{color:var(--muted);text-align:right}
  .sad{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--danger) 20%,transparent);display:grid;place-items:center;color:var(--danger)}
  .sad svg{width:34px;height:34px}

  /* ---- library sheet ---- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:82dvh;overflow-y:auto}
  .sheet h3{margin:0 0 14px;font-size:18px;font-weight:600}
  .crow{display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
  .crow.active{background:color-mix(in srgb,var(--accent) 20%,var(--raised))}
  .crow .n{font-weight:600;font-size:15px}
  .crow .p{color:var(--muted);font-size:12px}
  .crow .del{color:var(--muted);font-size:12px;flex:none}
  .imp{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .imp input[type=text]{padding:13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
  .imp .msg{font-size:12.5px}
  .imp .msg.err{color:var(--danger)} .imp .msg.ok{color:var(--accent)}
  .divider{height:1px;background:var(--line);margin:14px 0}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;font-size:13px;z-index:30;max-width:90%}

  .conf{position:absolute;top:0;width:7px;height:7px;border-radius:1px;background:var(--accent);animation:fall 1.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(140px) rotate(360deg);opacity:0}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .conf{display:none} .result .star{animation:none} .disc:active{transform:none}
    .timer i{transition:none}
  }
</style>
</head>
<body>
<div class="app" id="root"></div>
<script type="application/json" id="bundled-courses">
[
  {
    "schema": "vibolearning/v1",
    "id": "cpp-basics",
    "name": "C++ с азов",
    "accent": "#5AC8E6",
    "description": "Самые основы: от первой программы до функций",
    "author": "ViboLearning",
    "version": 3,
    "startingHearts": 5,
    "modules": [
      {
        "name": "Основные понятия",
        "order": 1,
        "practice": true,
        "lessons": [
          {
            "name": "Первая программа",
            "order": 1,
            "xp": 10,
            "blocks": [
              {
                "type": "text",
                "text": "Любая программа на C++ начинает выполняться с функции **main**. Всё, что внутри её фигурных скобок `{ }`, выполняется сверху вниз.",
                "code": "int main() {\n    // код программы\n    return 0;\n}"
              },
              {
                "type": "text",
                "text": "Строка `#include <iostream>` подключает библиотеку ввода-вывода, а `using namespace std;` позволяет писать `cout` вместо `std::cout`.",
                "code": "#include <iostream>\nusing namespace std;"
              },
              {
                "type": "code",
                "language": "cpp",
                "caption": "Запусти и посмотри на вывод. Потом поменяй текст в кавычках.",
                "code": "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Привет, мир!\" << endl;\n    return 0;\n}",
                "output": "Привет, мир!"
              },
              {
                "type": "text",
                "text": "`cout <<` отправляет данные на экран. `endl` переводит строку. `return 0;` сообщает системе, что программа завершилась без ошибок.",
                "code": "cout << \"Строка 1\" << endl;\ncout << \"Строка 2\" << endl;",
                "output": "Строка 1\nСтрока 2"
              },
              {
                "type": "quiz",
                "variant": "single",
                "prompt": "С какой функции начинается выполнение программы на C++?",
                "options": [
                  "start()",
                  "main()",
                  "run()",
                  "begin()"
                ],
                "answer": 1,
                "explanation": "Точка входа в программу — всегда `main()`."
              },
              {
                "type": "quiz",
                "variant": "type",
                "prompt": "Какой поток выводит текст на экран? Впиши пропущенное.",
                "code": "___ << \"Hi\" << endl;",
                "answer": [
                  "cout"
                ],
                "explanation": "`cout` — стандартный поток вывода (console output)."
              }
            ]
          },
          {
            "name": "Переменные и типы",
            "order": 2,
            "xp": 12,
            "blocks": [
              {
                "type": "text",
                "text": "Переменная — это именованная ячейка памяти. Перед именем указывают **тип**: он определяет, какие значения можно хранить. Формат: `тип имя = значение;`",
                "code": "int age = 18;\ncout << age;",
                "output": "18"
              },
              {
                "type": "text",
                "text": "Базовые типы: `int` — целые числа, `double` — дробные, `char` — один символ, `bool` — `true`/`false`, `string` — строка (нужен `#include <string>`).",
                "code": "int    count = 5;\ndouble price = 9.99;\nchar   letter = 'A';\nbool   ready = true;"
              },
              {
                "type": "code",
                "language": "cpp",
                "code": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int age = 18;\n    double price = 9.99;\n    char grade = 'A';\n    bool passed = true;\n    cout << age << \" \" << price << \" \" << grade << \" \" << passed << endl;\n    return 0;\n}",
                "output": "18 9.99 A 1"
              },
              {
                "type": "text",
                "text": "Обрати внимание: `bool` выводится как `1` (true) или `0` (false), а символ `char` пишут в одинарных кавычках.",
                "code": "bool ready = true;\nchar letter = 'A';\ncout << ready << \" \" << letter;",
                "output": "1 A"
              },
              {
                "type": "quiz",
                "variant": "single",
                "prompt": "Какой тип подойдёт для хранения числа 3.14?",
                "options": [
                  "int",
                  "char",
                  "double",
                  "bool"
                ],
                "answer": 2,
                "explanation": "`double` хранит числа с плавающей точкой."
              },
              {
                "type": "quiz",
                "variant": "multiple",
                "prompt": "Какие объявления корректны?",
                "options": [
                  "int count = 10;",
                  "double 2x = 4.0;",
                  "char c = 'z';",
                  "bool ok = yes;"
                ],
                "answer": [
                  0,
                  2
                ],
                "explanation": "Имя не может начинаться с цифры, а значение bool — это true/false, не yes."
              },
              {
                "type": "practice",
                "prompt": "Сопоставь тип и то, что он хранит",
                "terms": [
                  {
                    "display": "int",
                    "meaning": "Целые числа"
                  },
                  {
                    "display": "double",
                    "meaning": "Числа с дробной частью"
                  },
                  {
                    "display": "char",
                    "meaning": "Один символ"
                  },
                  {
                    "display": "bool",
                    "meaning": "Истину или ложь"
                  }
                ]
              }
            ]
          },
          {
            "name": "Ввод и операторы",
            "order": 3,
            "xp": 12,
            "blocks": [
              {
                "type": "text",
                "text": "`cin >>` считывает значение с клавиатуры в переменную. Направление стрелочек противоположно `cout`.",
                "code": "int x;\ncin >> x;        // ввели 5\ncout << x * 2;   // 10"
              },
              {
                "type": "code",
                "language": "cpp",
                "caption": "Тут ввода нет, значения заданы в коде — меняй их.",
                "code": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 7, b = 2;\n    cout << a + b << endl;\n    cout << a / b << endl;\n    cout << a % b << endl;\n    return 0;\n}",
                "output": "9\n3\n1"
              },
              {
                "type": "text",
                "text": "Для целых чисел `/` — деление нацело (`7 / 2 == 3`), а `%` — остаток от деления (`7 % 2 == 1`).",
                "code": "cout << 7 / 2 << endl;   // 3\ncout << 7 % 2 << endl;   // 1",
                "output": "3\n1"
              },
              {
                "type": "quiz",
                "variant": "single",
                "prompt": "Чему равно 17 % 5?",
                "options": [
                  "2",
                  "3",
                  "3.4",
                  "12"
                ],
                "answer": 0,
                "explanation": "17 = 3·5 + 2, остаток равен 2."
              },
              {
                "type": "quiz",
                "variant": "type",
                "prompt": "Какой оператор считывает значение с клавиатуры? Впиши пропущенное.",
                "code": "cin ___ x;",
                "answer": [
                  ">>"
                ],
                "explanation": "`cin >> x;` — извлечение из потока ввода."
              }
            ]
          }
        ],
        "exam": {
          "title": "Контрольные: основы",
          "passScore": 3,
          "xp": 30,
          "questions": [
            {
              "variant": "single",
              "prompt": "Что делает строка using namespace std;?",
              "options": [
                "Подключает файл iostream",
                "Позволяет не писать std:: перед cout, cin и т.д.",
                "Запускает программу",
                "Создаёт новую переменную"
              ],
              "answer": 1
            },
            {

                "malloc может вернуть NULL",
                "После fopen нужно проверить результат на NULL",
                "fclose закрывает файл",

              ],
              "answer": [

<script>
"use strict";
(function () {

/* ============================ bundled course ============================ */
/* The Android app reads this same JSON from assets. Kept in sync by hand;
   the hosted web build also tries ./courses/cpp-basics.json first. */
const BUNDLED_COURSES = JSON.parse(document.getElementById("bundled-courses").textContent);

/* ============================ storage ============================ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const store = {
  courses(){ return LS.get("vl.courses", []); },
  saveCourse(c){
    const all = store.courses().filter(x => x.id !== c.id);
    all.push(c); LS.set("vl.courses", all);
  },
  deleteCourse(id){ LS.set("vl.courses", store.courses().filter(x => x.id !== id)); },
  active(){ return LS.get("vl.active", null); },
  setActive(id){ LS.set("vl.active", id); },
  xp(){ return LS.get("vl.xp", 0); },
  addXp(n){ LS.set("vl.xp", store.xp() + n); },
  done(courseId){ return new Set(LS.get("vl.progress." + courseId, [])); },
  markDone(courseId, id){
    const s = store.done(courseId); s.add(id);
    LS.set("vl.progress." + courseId, [...s]);
  },
};

/* ============================ course model ============================ */
function slug(s){
  return (s||"").trim().toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "-").replace(/^-+|-+$/g, "") || "course";
}
function normalizeCourse(raw){
  if (!raw || typeof raw !== "object") throw new Error("Файл не похож на курс");
  if (!String(raw.schema || "").startsWith("vibolearning/")) throw new Error('Поле "schema" должно начинаться с "vibolearning/"');
  if (!raw.name) throw new Error("У курса нет названия");
  if (!Array.isArray(raw.modules) || !raw.modules.length) throw new Error("В курсе нет модулей");

  const id = raw.id || slug(raw.name);
  const modules = raw.modules
    .map((m, i) => ({ m, o: m.order || i + 1 }))
    .sort((a, b) => a.o - b.o)
    .map(({ m }, mi) => {
      if (!m.name) throw new Error("Модуль #" + (mi + 1) + " без названия");
      if (!Array.isArray(m.lessons) || !m.lessons.length) throw new Error('В модуле "' + m.name + '" нет уроков');
      const modId = m.id || ("m" + (mi + 1));
      const lessons = m.lessons
        .map((l, i) => ({ l, o: l.order || i + 1 }))
        .sort((a, b) => a.o - b.o)
        .map(({ l }, li) => {
          if (!l.name) throw new Error("Урок без названия в модуле «" + m.name + "»");
          const blocks = Array.isArray(l.blocks) ? l.blocks
            : Array.isArray(l.content && l.content.blocks) ? l.content.blocks : [];
          if (!blocks.length) throw new Error('В уроке "' + l.name + '" нет блоков');
          return { id: l.id || (modId + "_l" + (li + 1)), name: l.name, xp: l.xp || 10, blocks };
        });
      return { id: modId, name: m.name, practice: m.practice !== false, lessons, exam: m.exam || null };
    });
  return {
    id, name: raw.name, description: raw.description || "",
    accent: raw.accent || null, iconUrl: raw.iconUrl || null,
    startingHearts: raw.startingHearts || 5, version: raw.version || 1,
    builtin: !!raw.builtin, modules,
  };
}
function allCourses(){
  const list = BUNDLED_COURSES.map(c => normalizeCourse({ ...c, builtin: true }));
  const ids = new Set(list.map(c => c.id));
  for (const c of store.courses()) if (!ids.has(c.id)) list.push(c);
  return list;
}
function getCourse(id){ return allCourses().find(c => c.id === id) || allCourses()[0]; }
function courseTerms(course){
  const seen = new Map();
  for (const m of course.modules) for (const l of m.lessons) for (const b of l.blocks)
    if (b.type === "practice") for (const t of (b.terms || [])) if (t && t.meaning) seen.set(t.display, t);
  return [...seen.values()];
}
function moduleTerms(course, modId){
  const m = course.modules.find(x => x.id === modId); if (!m) return [];
  const seen = new Map();
  for (const l of m.lessons) for (const b of l.blocks)
    if (b.type === "practice") for (const t of (b.terms || [])) if (t && t.meaning) seen.set(t.display, t);
  return [...seen.values()];
}

/* ============================ engine ============================ */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function distractors(term, pool, n){ return shuffle(pool.filter(t => t.display !== term.display && t.meaning)).slice(0, n); }

function mcqCard(term, pool){
  const opts = shuffle([term, ...distractors(term, pool, 3)]).map(t => t.meaning);
  return { t: "quiz", q: { variant: "single", prompt: term.display, options: opts, answer: opts.indexOf(term.meaning) } };
}
function matchCard(prompt, terms){
  return { t: "match", prompt, pairs: terms.slice(0, 4) };
}
function lessonCards(lesson){
  const cards = [], learned = new Map();
  for (const b of lesson.blocks){
    if (b.type === "text") cards.push({ t: "info", text: b.text || "", code: b.code || "", output: b.output || "" });
    else if (b.type === "code") cards.push({ t: "code", code: b.code || "", output: b.output || "", lang: b.language || "cpp", editable: b.editable !== false, runnable: b.runnable !== false, caption: b.caption || "" });
    else if (b.type === "quiz") cards.push({ t: "quiz", q: normQ(b) });
    else if (b.type === "practice"){
      const terms = (b.terms || []).filter(x => x && x.meaning);
      for (const x of terms) learned.set(x.display, x);
      if (terms.length >= 2) cards.push(matchCard(b.prompt || "Мини-практика", terms.slice(0, 4)));
      terms.slice(4).forEach(term => cards.push(mcqCard(term, terms)));
    }
  }
  return { cards, learned: [...learned.values()] };
}
function examCards(exam){
  return { cards: (exam.questions || []).map(q => ({ t: "quiz", q: normQ(q) })), learned: [] };
}
function practiceCards(pool, size){
  const terms = [...new Map(pool.filter(x => x && x.meaning).map(x => [x.display, x])).values()];
  const n = Math.max(4, Math.min(size, terms.length));
  const pick = shuffle(terms).slice(0, n);
  const matchTerms = pick.slice(0, Math.min(4, pick.length));
  const singles = pick.slice(matchTerms.length);
  const cards = (singles.length ? singles : pick.slice(0, 2)).map(term => mcqCard(term, terms));
  if (matchTerms.length >= 2) cards.push(matchCard("Найди пару для каждого термина", matchTerms));
  return { cards, learned: pick };
}
function normQ(b){
  return {
    variant: b.variant || "single",
    prompt: b.prompt || "",
    code: b.code || "",
    options: b.options || [],
    items: b.items || [],
    answer: b.answer,
    explanation: b.explanation || "",
  };
}
const norm = s => String(s == null ? "" : s).trim().toLowerCase();
function checkAnswer(q, resp){
  if (q.variant === "single") return resp === q.answer;
  if (q.variant === "multiple"){
    const a = new Set(q.answer || []);
    return resp.size === a.size && [...resp].every(x => a.has(x));
  }
  if (q.variant === "type"){
    const acc = Array.isArray(q.answer) ? q.answer : [q.answer];
    return acc.some(x => norm(x) === norm(resp));
  }
  if (q.variant === "order") return JSON.stringify(resp) === JSON.stringify(q.answer || []);
  return false;
}
function correctText(q){
  if (q.variant === "single") return q.options[q.answer] || "";
  if (q.variant === "multiple") return (q.answer || []).map(i => q.options[i]).join(", ");
  if (q.variant === "type") return (Array.isArray(q.answer) ? q.answer[0] : q.answer) || "";
  if (q.variant === "order") return (q.answer || []).map(i => q.items[i]).join(" → ");
  return "";
}

/* ============================ code runner ============================ */
async function runCode(lang, code, canned){
  const map = { c: ["gcc-13.2.0", "warning,c17"], python: ["cpython-3.12.0", ""], py: ["cpython-3.12.0", ""] };
  const [compiler, options] = map[String(lang).toLowerCase()] || ["gcc-13.2.0", "warning,gnu++17"];
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    const res = await fetch("https://wandbox.org/api/compile.json", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, compiler, options, save: false }), signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error("wandbox " + res.status);
    const j = await res.json();
    let out = "";
    if (j.compiler_error) out += j.compiler_error.replace(/\n?$/, "\n");
    if (j.program_output) out += j.program_output;
    if (j.program_error) out += (out ? "\n" : "") + j.program_error;
    return { output: (out.trimEnd() || "(программа завершилась без вывода)"), source: "online" };
  } catch (e) {
    if (canned && canned.trim()) return { output: canned, source: "canned" };
    return { output: "Онлайн-компилятор недоступен, а сохранённого вывода у примера нет.", source: "unavailable" };
  }
}

/* ============================ helpers ============================ */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>")
    .replace(/_([^_]+)_/g, "<i>$1</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
const svg = {
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M4 9v6M20 9v6M7 7v10M17 7v10"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.4-1 .8-1 1.7V14"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.6 8.4 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.5C11 6.1 12.4 5 14.4 5c3.4 0 5.1 3.4 3.7 6.8C19.5 16.4 12 21 12 21z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.6 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>',
  sad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 15c1.2-1.3 2.6-2 4-2s2.8.7 4 2"/><circle cx="9" cy="9.5" r="1" fill="currentColor"/><circle cx="15" cy="9.5" r="1" fill="currentColor"/></svg>',
};

/* ============================ state ============================ */
const S = { route: "home", tab: "learn", library: false, toast: null, session: null };

function applyAccent(course){
  document.documentElement.style.setProperty("--accent", course && course.accent ? course.accent : "#9184d9");
}
function activeCourse(){
  const id = store.active() || allCourses()[0].id;
  return getCourse(id);
}

/* ============================ path building ============================ */
const DX = [0, 64, 96, 64, 0, -64, -96, -64];
function buildPath(course){
  const done = store.done(course.id);
  const nodes = [];
  let n = 0, prevCleared = true;
  const dx = () => DX[n++ % DX.length];
  course.modules.forEach((m, mi) => {
    const unlocked = prevCleared;
    nodes.push({ kind: "head", title: m.name, index: mi + 1 });
    let currentTaken = false;
    for (const l of m.lessons){
      const isDone = done.has(l.id);
      let status = "locked";
      if (isDone) status = "done";
      else if (unlocked && !currentTaken){ status = "current"; currentTaken = true; }
      nodes.push({ kind: "lesson", id: l.id, title: l.name, status, dx: dx() });
    }
    const allDone = m.lessons.length && m.lessons.every(l => done.has(l.id));
    if (m.practice && moduleTerms(course, m.id).length >= 2)
      nodes.push({ kind: "practice", modId: m.id, enabled: unlocked && allDone, dx: dx() });
    if (m.exam){
      const examDone = done.has(m.id + "__exam");
      const status = examDone ? "done" : (unlocked && allDone ? "current" : "locked");
      nodes.push({ kind: "exam", modId: m.id, title: m.exam.title || "Контрольные вопросы", status, dx: dx() });
    }
    prevCleared = allDone && (!m.exam || done.has(m.id + "__exam"));
  });
  return nodes;
}

/* ============================ session ============================ */
function startSession(mode, ref){
  const course = activeCourse();
  let built, title, baseXp = 0, passScore = 0, progressId = null;
  try {
    if (mode === "lesson"){
      let lesson = null;
      for (const m of course.modules) for (const l of m.lessons) if (l.id === ref) lesson = l;
      if (!lesson) return toast("Урок не найден");
      built = lessonCards(lesson); title = lesson.name; baseXp = lesson.xp; progressId = lesson.id;
    } else if (mode === "exam"){
      const m = course.modules.find(x => x.id === ref);
      if (!m || !m.exam) return toast("Контрольные не найдены");
      built = examCards(m.exam); title = m.exam.title || "Контрольные вопросы";
      baseXp = m.exam.xp || 25; passScore = m.exam.passScore || 0; progressId = m.id + "__exam";
    } else {
      const pool = ref === "all" ? courseTerms(course) : moduleTerms(course, ref);
      if (pool.length < 2) return toast("Недостаточно терминов для практики");
      built = practiceCards(pool, 8);
      title = ref === "all" ? "Практика" : ((course.modules.find(x => x.id === ref) || {}).name || "Практика");
    }
  } catch (e){ return toast(e.message || "Не удалось собрать сессию"); }

  S.session = {
    mode, ref, courseId: course.id, title, baseXp, passScore, progressId,
    cards: built.cards, learned: built.learned,
    i: 0, hearts: course.startingHearts, startHearts: course.startingHearts,
    correct: 0, interactive: built.cards.filter(c => c.t === "quiz" || c.t === "match").length,
    streak: 0, best: 0,
    timeLeft: 15, timerId: null,
    answered: false, ok: null,
    sel: null, selSet: new Set(), typed: "", ordering: [],
    matched: new Set(), selL: null, selR: null, wrong: null,
    codeText: "", running: false, runOut: null, runSrc: null,
    xpEarned: 0,
  };
  S.route = "play";
  enterCard();
  render();
}
const heartsMatter = () => S.session.mode === "lesson" || S.session.mode === "exam";

function enterCard(){
  const s = S.session; clearInterval(s.timerId); s.timerId = null;
  const c = s.cards[s.i];
  if (c && c.t === "code") s.codeText = c.code;
  if (s.mode === "practice" && c && c.t === "quiz"){
    s.timeLeft = 15;
    s.timerId = setInterval(() => {
      if (s.answered) return;
      s.timeLeft--;
      if (s.timeLeft <= 0){ clearInterval(s.timerId); s.answered = true; s.ok = false; s.streak = 0; render(); }
      else updateTimer();
    }, 1000);
  }
}
function commit(ok, extra){
  const s = S.session;
  clearInterval(s.timerId); s.timerId = null;
  if (extra) extra(s);
  if (heartsMatter() && !ok) s.hearts = Math.max(0, s.hearts - 1);
  if (s.mode === "practice") s.streak = ok ? s.streak + 1 : 0;
  s.best = Math.max(s.best, s.streak);
  s.answered = true; s.ok = ok;
  render();
}
function next(){
  const s = S.session;
  const card = s.cards[s.i];
  const wasInteractive = card && (card.t === "quiz" || card.t === "match");
  if (heartsMatter() && s.ok === false && s.hearts <= 0){
    s.failReason = "Сердечки закончились"; S.route = "failed"; return render();
  }
  if (wasInteractive && s.ok) s.correct++;
  s.i++;
  if (s.i >= s.cards.length) return finish();
  Object.assign(s, { answered: false, ok: null, sel: null, selSet: new Set(), typed: "", ordering: [], matched: new Set(), selL: null, selR: null, wrong: null, runOut: null, runSrc: null });
  enterCard();
  render();
}
function finish(){
  const s = S.session;
  if (s.mode === "exam" && s.passScore > 0 && s.correct < s.passScore){
    s.failReason = "Нужно верно ответить хотя бы на " + s.passScore + " из " + s.interactive;
    S.route = "failed"; return render();
  }
  s.xpEarned = s.baseXp + s.correct * 2;
  if (s.mode !== "practice" && s.progressId) store.markDone(s.courseId, s.progressId);
  if (s.xpEarned > 0) store.addXp(s.xpEarned);
  S.route = "complete";
  render();
}
function retry(){ const s = S.session; startSession(s.mode, s.ref); }
function exitSession(){ clearInterval(S.session && S.session.timerId); S.session = null; S.route = "home"; render(); }

/* ============================ render ============================ */
const root = document.getElementById("root");

function render(){
  applyAccent(activeCourse());
  if (S.route === "home") root.innerHTML = viewHome();
  else if (S.route === "play") root.innerHTML = viewPlay();
  else if (S.route === "complete") root.innerHTML = viewComplete();
  else if (S.route === "failed") root.innerHTML = viewFailed();
  if (S.library) root.insertAdjacentHTML("beforeend", viewLibrary());
  if (S.toast) root.insertAdjacentHTML("beforeend", '<div class="toast">' + esc(S.toast) + "</div>");
}

function viewHome(){
  const course = activeCourse();
  const done = store.done(course.id);
  const total = course.modules.reduce((a, m) => a + m.lessons.length, 0);
  const doneCount = [...done].filter(x => !x.endsWith("__exam")).length;
  const xp = store.xp();
  const head = `
    <div class="head">
      <h1>${esc(course.name)}</h1>
      <button class="iconbtn" data-act="library" aria-label="Курсы">${svg.book}</button>
    </div>
    <div class="sub">${esc(course.description || "Курс")} · ${total} ур.${xp ? " · " + xp + " XP" : ""}</div>`;

  let body;
  if (S.tab === "learn"){
    const nodes = buildPath(course).map(nodeHtml).join("");
    body = `<div class="screen"><div class="path">${nodes}</div></div>`;
  } else {
    const terms = courseTerms(course);
    const learned = course.modules.flatMap(m => m.lessons).filter(l => done.has(l.id))
      .flatMap(l => l.blocks).filter(b => b.type === "practice").flatMap(b => b.terms || []);
    const learnedCount = new Set(learned.map(t => t.display)).size;
    body = `<div class="screen"><div class="pane">
      <h2>Практика</h2>
      <div class="card-box">
        <div class="k">СКОРОСТЬ И ПОВТОРЕНИЕ</div>
        <div class="h">Проверь себя на время</div>
        <p>15 секунд на вопрос, без сердечек — набери максимальную серию.</p>
        <div class="meta">${learnedCount} из ${terms.length} терминов изучено</div>
      </div>
      <button class="btn ${terms.length >= 2 ? "" : ""}" data-act="practice" data-ref="all" ${terms.length < 2 ? "disabled" : ""}>Начать практику</button>
      ${learnedCount === 0 ? '<p style="color:var(--muted);font-size:12px;margin:0">Практика берёт термины из всего курса — можно и до прохождения уроков.</p>' : ""}
    </div></div>`;
  }

  const tabbar = `
    <div class="tabbar">
      <button class="${S.tab === "learn" ? "on" : ""}" data-act="tab" data-tab="learn">${svg.book}<span>Учиться</span></button>
      <button class="${S.tab === "practice" ? "on" : ""}" data-act="tab" data-tab="practice">${svg.target}<span>Практика</span></button>
    </div>`;

  return head + body + tabbar;
}

function nodeHtml(nd){
  if (nd.kind === "head")
    return `<div class="mod-head"><div class="k">МОДУЛЬ ${nd.index}</div><div class="t">${esc(nd.title)}</div><div class="rule"></div></div>`;

  const style = `style="transform:translateX(${nd.dx}px)"`;
  if (nd.kind === "lesson"){
    const ic = nd.status === "done" ? svg.check : nd.status === "current" ? svg.play : svg.lock;
    const dis = nd.status === "locked";
    return `<button class="node ${dis ? "is-disabled" : ""}" ${style} ${dis ? "" : `data-act="lesson" data-ref="${nd.id}"`}>
      <span class="disc ${nd.status}"><span class="fill">${ic}</span></span>
      <span class="label">${esc(nd.title)}</span></button>`;
  }
  if (nd.kind === "practice"){
    const dis = !nd.enabled;
    return `<button class="node ${dis ? "is-disabled" : ""}" ${style} ${dis ? "" : `data-act="practice" data-ref="${nd.modId}"`}>
      <span class="disc ${dis ? "locked" : "current"}"><span class="fill">${nd.enabled ? svg.dumbbell : svg.lock}</span></span>
      <span class="label">Практика</span></button>`;
  }
  // exam
  const dis = nd.status === "locked";
  const ic = nd.status === "done" ? svg.check : nd.status === "locked" ? svg.lock : svg.quiz;
  return `<button class="node ${dis ? "is-disabled" : ""}" ${style} ${dis ? "" : `data-act="exam" data-ref="${nd.modId}"`}>
    <span class="disc ${nd.status}"><span class="fill">${ic}</span></span>
    <span class="label">${esc(nd.title)}</span></button>`;
}

function viewPlay(){
  const s = S.session;
  const segs = s.cards.map((_, i) => `<i class="${i < s.i ? "done" : i === s.i ? "cur" : ""}"></i>`).join("");
  const counter = s.mode === "practice"
    ? `<span class="count streak">${svg.bolt}${s.streak}</span>`
    : `<span class="count heart">${svg.heart}${s.hearts}</span>`;
  const timer = (s.mode === "practice" && s.cards[s.i] && s.cards[s.i].t === "quiz")
    ? `<div class="timer"><i id="timerfill" class="${s.timeLeft <= 5 ? "low" : ""}" style="width:${s.timeLeft / 15 * 100}%"></i></div>` : "";

  return `<div class="play">
    <div class="play-top">
      <button class="x" data-act="exit" aria-label="Выйти">${svg.x}</button>
      <div class="segs">${segs}</div>
      ${counter}
    </div>
    ${timer}
    <div class="cardwrap">${cardHtml(s.cards[s.i])}</div>
    ${bottomHtml()}
  </div>`;
}

function cardHtml(c){
  if (!c) return "";
  const s = S.session;
  if (c.t === "info") return `<div class="prose">${md(c.text)}</div>`
    + (c.code ? `<pre class="code" style="margin-top:16px">${esc(c.code)}</pre>` : "")
    + (c.output ? `<div class="out"><div class="k">ВЫВОД</div><pre>${esc(c.output)}</pre></div>` : "");

  if (c.t === "code"){
    const editor = c.editable
      ? `<textarea class="code" data-act="codeedit" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(s.codeText)}</textarea>`
      : `<pre class="code">${esc(s.codeText)}</pre>`;
    let out = "";
    if (s.runOut != null){
      const lbl = s.runSrc === "online" ? "ВЫВОД" : s.runSrc === "canned" ? "ВЫВОД · оффлайн-образец" : "ВЫВОД НЕДОСТУПЕН";
      out = `<div class="out"><div class="k">${lbl}</div><pre>${esc(s.runOut)}</pre></div>`;
    }
    return `${c.caption ? `<div class="caption">${esc(c.caption)}</div>` : ""}
      ${editor}
      <div class="runrow">
        ${c.runnable ? `<button class="btn fill sm" data-act="run" ${s.running ? "disabled" : ""} style="flex:1">${s.running ? "Компиляция…" : "Запустить"}</button>` : ""}
        ${c.editable ? `<button class="btn ghost sm" data-act="resetcode">Сброс</button>` : ""}
      </div>${out}`;
  }

  if (c.t === "match"){
    const left = c._left || (c._left = shuffle(c.pairs.map(p => ({ text: p.display, id: p.display }))));
    const right = c._right || (c._right = shuffle(c.pairs.map(p => ({ text: p.meaning, id: p.display }))));
    const cell = (it, side, i) => {
      let cls = "match" + (side === "L" ? " mono" : "");
      if (s.matched.has(it.id)) cls += " correct";
      else if (s.wrong && s.wrong[side] === i) cls += " wrong";
      else if ((side === "L" ? s.selL : s.selR) === i) cls += " sel";
      return `<button class="${cls}" data-act="match" data-side="${side}" data-i="${i}">${esc(it.text)}</button>`;
    };
    return `<div class="instr">💡 ${esc(c.prompt)}</div>
      <div class="cols">
        <div>${left.map((it, i) => cell(it, "L", i)).join("")}</div>
        <div>${right.map((it, i) => cell(it, "R", i)).join("")}</div>
      </div>`;
  }

  // quiz
  const q = c.q;
  const instr = { multiple: "Выбери все верные варианты", type: "Впиши ответ", order: "Расставь элементы по порядку" }[q.variant] || "Выбери правильный ответ";
  let body = "";
  if (q.variant === "type"){
    const cls = s.answered ? (s.ok ? "ok" : "no") : "";
    body = `<input class="typed ${cls}" data-act="typed" value="${esc(s.typed)}" ${s.answered ? "disabled" : ""} spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="ответ">`;
  } else if (q.variant === "order"){
    const chip = (i, placed) => `<button class="opt mono ${placed ? "sel" : ""}" data-act="ord" data-i="${i}" ${s.answered ? "disabled" : ""}>${esc(q.items[i])}</button>`;
    const avail = q.items.map((_, i) => i).filter(i => !s.ordering.includes(i));
    body = `<div class="sub-h">Ответ:</div><div class="opts">${s.ordering.map(i => chip(i, true)).join("") || '<div style="color:var(--muted);font-size:13px">— пусто —</div>'}</div>
      <div class="sub-h">Доступно:</div><div class="opts">${avail.map(i => chip(i, false)).join("")}</div>`;
  } else {
    const multi = q.variant === "multiple";
    const correctSet = new Set(multi ? (q.answer || []) : [q.answer]);
    body = `<div class="opts">${q.options.map((o, i) => {
      let cls = "opt";
      if (s.answered && correctSet.has(i)) cls += " correct";
      else if (s.answered && (multi ? s.selSet.has(i) : s.sel === i)) cls += " wrong";
      else if (multi ? s.selSet.has(i) : s.sel === i) cls += " sel";
      return `<button class="${cls}" data-act="${multi ? "toggle" : "pick"}" data-i="${i}" ${s.answered ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
  }
  return `<div class="instr">💡 ${esc(instr)}</div>
    ${q.code ? `<pre class="code" style="margin-bottom:16px">${esc(q.code)}</pre>` : ""}
    <p class="q">${md(q.prompt)}</p>
    ${body}`;
}

function bottomHtml(){
  const s = S.session;
  const c = s.cards[s.i];
  if (s.answered && c && (c.t === "quiz" || c.t === "match")){
    const q = c.t === "quiz" ? c.q : null;
    return `<div class="feedback ${s.ok ? "ok" : "no"}">
      <div class="t">${s.ok ? "Отлично!" : "Правильный ответ: " + esc(q ? correctText(q) : "")}</div>
      ${q && q.explanation ? `<div class="why">${md(q.explanation)}</div>` : ""}
      <button class="btn fill" data-act="next">Продолжить</button>
    </div>`;
  }
  if (!c) return "";
  if (c.t === "info" || c.t === "code")
    return `<div class="actionbar"><button class="btn fill" data-act="next">Продолжить</button></div>`;
  if (c.t === "quiz"){
    const q = c.q;
    if (q.variant === "multiple")
      return `<div class="actionbar"><button class="btn" data-act="submultiple" ${s.selSet.size ? "" : "disabled"}>Проверить</button></div>`;
    if (q.variant === "type")
      return `<div class="actionbar"><button class="btn" data-act="subtyped" ${s.typed.trim() ? "" : "disabled"}>Проверить</button></div>`;
    if (q.variant === "order")
      return `<div class="actionbar"><button class="btn" data-act="suborder" ${s.ordering.length === q.items.length ? "" : "disabled"}>Проверить</button></div>`;
  }
  return "";
}

function viewComplete(){
  const s = S.session;
  const title = s.mode === "lesson" ? "Урок пройден!" : s.mode === "exam" ? "Модуль зачтён!" : "Практика завершена!";
  const conf = Array.from({ length: 9 }, (_, i) =>
    `<i class="conf" style="left:${8 + i * 10}%;animation-delay:${i * 0.06}s;background:${i % 2 ? "var(--accent)" : "color-mix(in srgb,var(--accent) 60%,#fff)"}"></i>`).join("");
  const third = s.mode === "practice"
    ? `<div><div class="v" style="color:var(--accent)">${s.best}</div><div class="l">Серия</div></div>`
    : `<div><div class="v" style="color:var(--danger)">${s.hearts}</div><div class="l">Сердечки</div></div>`;
  const learned = s.learned && s.learned.length
    ? `<div class="learned"><div class="k">ТЫ РАЗОБРАЛ(А)</div>${s.learned.map(t => `<div class="row"><span>${esc(t.display)}</span><span class="m">${esc(t.meaning)}</span></div>`).join("")}</div>` : "";
  return `<div class="result">${conf}
    <span class="star">${svg.star}</span>
    <h2>${title}</h2>
    <div class="stats">
      <div><div class="v" style="color:var(--accent)">+${s.xpEarned}</div><div class="l">Опыт</div></div>
      <div><div class="v">${s.correct}/${s.interactive}</div><div class="l">Верно</div></div>
      ${third}
    </div>
    ${learned}
    <button class="btn fill" data-act="exit">Продолжить</button>
  </div>`;
}

function viewFailed(){
  const s = S.session;
  return `<div class="result" style="justify-content:center">
    <div class="sad">${svg.sad}</div>
    <h2>${esc(s.failReason || "Не получилось")}</h2>
    <p style="color:var(--muted);margin:0">Не переживай, попробуй ещё раз</p>
    <div style="height:8px"></div>
    <button class="btn fill" data-act="retry">Начать заново</button>
    <button class="btn ghost" data-act="exit">Выйти</button>
  </div>`;
}

function viewLibrary(){
  const list = allCourses();
  const active = activeCourse().id;
  const rows = list.map(c => {
    const total = c.modules.reduce((a, m) => a + m.lessons.length, 0);
    const dn = [...store.done(c.id)].filter(x => !x.endsWith("__exam")).length;
    return `<div class="crow ${c.id === active ? "active" : ""}" data-act="switch" data-id="${esc(c.id)}">
      <div style="flex:1"><div class="n">${esc(c.name)}</div><div class="p">${dn}/${total} уроков</div></div>
      ${c.builtin ? "" : `<button class="del" data-act="delcourse" data-id="${esc(c.id)}">Удалить</button>`}
    </div>`;
  }).join("");
  const m = S.imp || {};
  return `<div class="scrim" data-act="closelib">
    <div class="sheet" data-stop>
      <h3>Курсы</h3>
      ${rows}
      <div class="divider"></div>
      <div class="imp">
        ${m.msg ? `<div class="msg ${m.err ? "err" : "ok"}">${esc(m.msg)}</div>` : ""}
        <input type="text" id="impurl" placeholder="https://…/course.json" value="${esc(m.url || "")}">
        <button class="btn sm" data-act="importurl">Импорт по ссылке</button>
        <label class="btn ghost sm" style="display:block">Импорт файла .json
          <input type="file" id="impfile" accept=".json,application/json" style="display:none">
        </label>
      </div>
    </div>
  </div>`;
}

function updateTimer(){
  const s = S.session, el = document.getElementById("timerfill");
  if (!el) return;
  el.style.width = (s.timeLeft / 15 * 100) + "%";
  el.classList.toggle("low", s.timeLeft <= 5);
}
let toastTimer = null;
function toast(msg){
  S.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600);
}

/* ============================ events ============================ */
root.addEventListener("input", e => {
  const t = e.target;
  if (!S.session) return;
  if (t.matches("[data-act=codeedit]")) {
    S.session.codeText = t.value;
  } else if (t.matches("[data-act=typed]")) {
    S.session.typed = t.value;
    // No re-render while typing (keeps focus) — toggle the check button by hand.
    const btn = root.querySelector("[data-act=subtyped]");
    if (btn) btn.disabled = !t.value.trim();
  }
});
root.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches && e.target.matches("[data-act=typed]")) {
    e.preventDefault();
    const b = root.querySelector("[data-act=subtyped]");
    if (b && !b.disabled) b.click();
  }
});
root.addEventListener("change", e => {
  if (e.target.id === "impfile" && e.target.files && e.target.files[0]){
    const fr = new FileReader();
    fr.onload = () => importRaw(fr.result);
    fr.readAsText(e.target.files[0]);
  }
});
root.addEventListener("click", e => {
  const url = e.target.closest("#impurl"); if (url) return;
  const node = e.target.closest("[data-act]");
  if (!node){
    if (e.target.classList.contains("scrim")){ S.library = false; S.imp = null; render(); }
    return;
  }
  const a = node.dataset.act, s = S.session;

  if (a === "tab"){ S.tab = node.dataset.tab; return render(); }
  if (a === "library"){ S.library = true; S.imp = null; return render(); }
  if (a === "closelib" && e.target.classList.contains("scrim")){ S.library = false; S.imp = null; return render(); }
  if (a === "switch"){ store.setActive(node.dataset.id); S.library = false; S.imp = null; S.tab = "learn"; return render(); }
  if (a === "delcourse"){ e.stopPropagation(); store.deleteCourse(node.dataset.id);
    if (store.active() === node.dataset.id) store.setActive(allCourses()[0].id); return render(); }
  if (a === "importurl"){
    const v = (document.getElementById("impurl") || {}).value || "";
    if (!v.trim()) return;
    S.imp = { url: v, msg: "Загрузка…" }; render();
    fetch(v.trim()).then(r => r.text()).then(importRaw)
      .catch(() => { S.imp = { url: v, msg: "Не удалось загрузить (нет сети или CORS)", err: true }; render(); });
    return;
  }
  if (a === "lesson") return startSession("lesson", node.dataset.ref);
  if (a === "exam") return startSession("exam", node.dataset.ref);
  if (a === "practice") return startSession("practice", node.dataset.ref);
  if (a === "exit") return exitSession();
  if (a === "retry") return retry();

  if (!s) return;
  if (a === "pick"){ if (s.answered) return; const i = +node.dataset.i;
    commit(checkAnswer(s.cards[s.i].q, i), st => st.sel = i); return; }
  if (a === "toggle"){ if (s.answered) return; const i = +node.dataset.i;
    s.selSet.has(i) ? s.selSet.delete(i) : s.selSet.add(i); return render(); }
  if (a === "submultiple"){ if (s.answered || !s.selSet.size) return;
    commit(checkAnswer(s.cards[s.i].q, s.selSet)); return; }
  if (a === "subtyped"){ if (s.answered || !s.typed.trim()) return;
    commit(checkAnswer(s.cards[s.i].q, s.typed)); return; }
  if (a === "ord"){ if (s.answered) return; const i = +node.dataset.i;
    const at = s.ordering.indexOf(i);
    s.ordering = at >= 0 ? s.ordering.slice(0, at) : [...s.ordering, i];
    return render(); }
  if (a === "suborder"){ const q = s.cards[s.i].q; if (s.answered || s.ordering.length !== q.items.length) return;
    commit(checkAnswer(q, s.ordering)); return; }
  if (a === "match"){ if (s.answered || s.wrong) return; return doMatch(node.dataset.side, +node.dataset.i); }
  if (a === "run"){ return doRun(); }
  if (a === "resetcode"){ const c = s.cards[s.i]; s.codeText = c.code; s.runOut = null; s.runSrc = null; return render(); }
  if (a === "next") return next();
});

function doMatch(side, i){
  const s = S.session, c = s.cards[s.i];
  const left = c._left, right = c._right;
  const it = side === "L" ? left[i] : right[i];
  if (s.matched.has(it.id)) return;
  if (side === "L") s.selL = s.selL === i ? null : i;
  else s.selR = s.selR === i ? null : i;
  if (s.selL != null && s.selR != null){
    if (left[s.selL].id === right[s.selR].id){
      s.matched.add(left[s.selL].id); s.selL = null; s.selR = null;
      if (s.matched.size === c.pairs.length){ render(); setTimeout(() => commit(true), 260); return; }
    } else {
      s.wrong = { L: s.selL, R: s.selR };
      render();
      setTimeout(() => { s.wrong = null; s.selL = null; s.selR = null; render(); }, 560);
      return;
    }
  }
  render();
}

async function doRun(){
  const s = S.session, c = s.cards[s.i];
  if (s.running) return;
  s.running = true; s.runOut = null; render();
  const r = await runCode(c.lang, s.codeText, c.output);
  s.running = false; s.runOut = r.output; s.runSrc = r.source;
  render();
}

function importRaw(raw){
  try {
    const parsed = normalizeCourse(typeof raw === "string" ? JSON.parse(raw) : raw);
    store.saveCourse(parsed);
    store.setActive(parsed.id);
    S.library = false; S.imp = null; S.tab = "learn";
    render();
    toast("Добавлен курс «" + parsed.name + "»");
  } catch (e){
    S.imp = Object.assign(S.imp || {}, { msg: e.message || "Неверный формат", err: true });
    render();
  }
}

/* ============================ init ============================ */
if (!store.active() && BUNDLED_COURSES.length) {
  store.setActive(normalizeCourse(BUNDLED_COURSES[0]).id);
}
render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

})();
</script>
</body>
</html>
